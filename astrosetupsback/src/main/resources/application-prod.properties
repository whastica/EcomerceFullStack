# ============================================================
# Perfil PROD (staging) - activar con SPRING_PROFILES_ACTIVE=prod
# Hereda application.properties y sobreescribe lo siguiente.
# ============================================================

# Esquema: update conserva los datos importados por dump (Fase 6)
spring.jpa.hibernate.ddl-auto=update

# NO ejecutar data.sql en produccion (el catálogo viene del dump)
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# Silenciar SQL en logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT: sin valor por defecto - la aplicacion FALLA al arrancar si
# JWT_SECRET no esta definida (fail-fast, evitar secret hardcodeado)
jwt.secret=${JWT_SECRET}

# Origenes CORS: en produccion se define via CORS_ALLOWED_ORIGINS
# (Railway: https://<app>.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
