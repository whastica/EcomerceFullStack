spring.application.name=astrosetupsBackend

# Puerto (Railway inyecta PORT; fallback local 8081)
server.port=${PORT:8081}

#configuracion MySQL (variables de entorno con valores locales por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/astrosetupsdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# para crear las tablas automaticamente al arrancar la aplicacion
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true


#Mostrar consultas en los logs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Origenes CORS permitidos (en produccion: dominio de Vercel, separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Configuration
jwt.secret=${JWT_SECRET:astrosetups-secret-key-for-development-only-minimum-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.token-prefix=Bearer
jwt.header-string=Authorization
