spring.application.name=astrosetupsBackend
server.port=8081

#configuracion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/astrosetupsdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# para crear la tablas automaticamente al arrancar la aplicacion
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always


#Mostrar consultas en los logs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:astrosetups-secret-key-for-development-only-minimum-32-chars}
jwt.expiration-ms=86400000
jwt.token-prefix=Bearer
jwt.header-string=Authorization