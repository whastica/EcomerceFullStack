# ============================================================
# Perfil TEST - H2 en memoria (no requiere MySQL)
# Activado por @ActiveProfiles("test") en los tests.
# ============================================================

# H2 en memoria en modo compatibilidad MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Dialecto H2 (sobreescribe el MySQL del application.properties)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Crear esquema desde entidades; NO ejecutar data.sql en tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false

# Silenciar SQL en logs de test
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT de prueba (el default de application.properties ya aplica, se explicita por claridad)
jwt.secret=test-secret-key-for-unit-tests-minimum-32-chars
